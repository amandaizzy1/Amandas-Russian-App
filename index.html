<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russian Sentence Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">

    <!-- ===== TOP HUD ===== -->
    <div class="hud">

      <div class="hudLeft">
        <div id="hudLevel" class="hudLevel">A0</div>

        <div id="hudSub" class="hudSub">
          0 learned • 0 mastered
        </div>

        <div class="hudPills">
          <div class="pill">
            🔥 Streak <b id="hudStreak">0</b>
          </div>

          <div class="pill">
            ⚡ Daily XP
            <b id="hudDailyXP">0</b>
            /
            <span id="hudDailyGoal">80</span>
          </div>

          <div class="pill">
            ⭐ Total XP
            <b id="hudTotalXP">0</b>
          </div>

          <div class="pill">
            📦 Due
            <b id="hudDue">0</b>
          </div>
        </div>
      </div>

      <div class="hudRight">

        <div class="goalBox">
          <div class="goalLabel">Daily Goal</div>

          <div class="goalRow">
            <input
              id="dailyGoalInput"
              type="number"
              min="0"
              step="5"
              value="80"
            >

            <button id="btnSetGoal">
              Set
            </button>
          </div>

          <div class="goalHint muted">
            Set to 0 to disable goals.
          </div>
        </div>

        <div
          id="dailyRingHolder"
          class="ringHolder"
        ></div>

      </div>

    </div>

    <!-- ===== TITLE ===== -->

    <h1>Russian Sentence Trainer</h1>

    <!-- ===== TOP BUTTONS ===== -->

    <div class="row">
      <button
        id="btnReset"
        class="dangerButton"
      >
        Reset Progress
      </button>

      <button id="btnLoadSample">
        Load Sample Set
      </button>
    </div>

    <!-- ===== LESSON ===== -->

    <div class="card">

      <h2>Lesson</h2>

      <div class="row">

        <label>
          Lesson Size
        </label>

        <input
          id="lessonSize"
          type="number"
          min="5"
          max="50"
          value="20"
        >

        <label>
          New Per Lesson
        </label>

        <input
          id="newPerLesson"
          type="number"
          min="0"
          max="50"
          value="10"
        >

        <button id="btnStart">
          Start Lesson
        </button>

      </div>

      <div
        id="lessonStatus"
        class="muted"
      ></div>

      <div
        id="promptArea"
        class="promptArea hidden"
      >

        <div
          id="promptEn"
          class="promptEn"
        ></div>

        <div
          id="answerLine"
          class="answerLine"
        ></div>

        <div class="row">

          <button id="btnUndo">
            Undo
          </button>

          <button id="btnClear">
            Clear
          </button>

          <button id="btnSubmit">
            Submit
          </button>

        </div>

        <h3>Word Bank</h3>

        <div
          id="bank"
          class="bank"
        ></div>

        <div
          id="feedback"
          class="feedback"
        ></div>

        <div class="row">

          <button id="btnNext">
            Next
          </button>

          <button id="btnSpeak">
            Play Russian Audio
          </button>

        </div>

      </div>

    </div>

    <!-- ===== STATS ===== -->

    <div class="card">

      <h2>Stats</h2>

      <div id="stats"></div>

    </div>

    <!-- ===== ADMIN / DATA ===== -->

    <details class="card">

      <summary class="summary">
        Admin / Data (click to expand)
      </summary>

      <p
        class="muted"
        style="margin-top:10px;"
      >
        Paste lines like:
        English = Russian
      </p>

      <textarea
        id="dataInput"
        rows="10"
        spellcheck="false"
      ></textarea>

      <div class="row">

        <button id="btnImport">
          Import Sentences
        </button>

        <span id="importStatus"></span>

      </div>

      <h3>Imported Sentences</h3>

      <div
        id="adminList"
        class="adminList"
      ></div>

    </details>

  </div>

  <script src="script.js"></script>
</body>
</html>
